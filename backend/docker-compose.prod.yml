# Production-oriented overlay: no host exposure for DB/Redis, credentials from env.
# Usage (example):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Required env (in `.env` or the environment):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, DJANGO_SECRET_KEY, ...

services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # Explicitly no host ports in production.

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]

  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_STREAMS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_CHANNELS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    volumes: []

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_STREAMS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_CHANNELS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    volumes: []
